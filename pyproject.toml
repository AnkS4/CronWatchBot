[project]
name = "cronwatchbot"
version = "2.1"
description = "Manage urlwatch and crontab via Telegram"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE*"]
authors = [
    { name = "Aniket Satbhai", email = "anks@tuta.io" },
]
keywords = ["telegram", "bot", "crontab", "urlwatch"]
dependencies = [
    "python-crontab>=3.3.0",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.7",
    "pyyaml>=6.0.3",
    "urlwatch>=2.29",
]

[project.urls]
Repository = "https://github.com/AnkS4/CronWatchBot"
"Bug Tracker" = "https://github.com/AnkS4/CronWatchBot/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.7",
    "mypy>=1.19.1",
    # ty is Astral's new type checker (same ecosystem as uv/ruff).
    # Switch to it once it stabilises — for now mypy is the safe choice.
    # "ty>=0.0.24",
    "types-PyYAML>=6.0.12.20250915",
]

# ── Build system ──────────────────────────────────────────────────────────────
[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Explicit package list because the project root contains non-package dirs
# (docker/, tests/, …). Without this uv_build may include more than intended.
module-name = ["config", "handlers", "helpers", "utils"]
module-root = ""

# ── uv ────────────────────────────────────────────────────────────────────────
[tool.uv]
managed = true
package = true                # this is an installable package, not just scripts
default-groups = ["dev"]      # `uv sync` installs dev group automatically
compile-bytecode = true       # mirrors UV_COMPILE_BYTECODE=1 in the Dockerfile

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "S",        # flake8-bandit (security)
    "SIM",      # flake8-simplify
    "TC",       # flake8-type-checking (moves TYPE_CHECKING-only imports)
    "PT",       # flake8-pytest-style
    "RUF",      # ruff-specific rules
    "ERA",      # eradicate (commented-out code)
    "ANN",      # flake8-annotations — complements mypy; catches missing hints fast
    "PERF",     # perflint (performance anti-patterns)
    "TRY",      # tryceratops (exception handling hygiene)
    "PL",       # pylint subset (correctness rules not covered elsewhere)
    "FBT",      # boolean trap — prevents positional bool args in function sigs
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "S101",     # assert — fine in application code too, not just tests
    "TRY003",   # long exception messages in raise — overly strict for a small project
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",      # type hints in tests add noise without mypy benefit
    "PT011",    # broad pytest.raises — sometimes intentional
    "PLR2004",  # magic values common in test assertions
    "FBT",      # boolean args fine in test helpers
    "S101",     # assert statements
    "S105",     # hardcoded passwords — test fixtures use literal strings
]
"handlers/shared.py" = [
    "ANN401",   # Any is necessary in decorator return types
]
"handlers/urlwatch_manage.py" = [
    "PLR0911",  # edit_url_filters and edit_url_properties have complex validation logic
    "PLR0912",  # edit_url_properties has complex branching for property parsing
]

[tool.ruff.lint.isort]
known-first-party = ["config", "handlers", "helpers", "utils"]
force-sort-within-sections = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true     # *args: Any / **kwargs: Any are legitimate

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true  # also format code blocks inside docstrings

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
strict = true
extra_checks = true           # enables warn_redundant_casts, warn_unused_ignores, etc.
warn_unreachable = true
local_partial_types = true    # error on partially unknown types within a module
show_error_codes = true
show_column_numbers = true
pretty = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["telegram.*", "crontab.*", "urlwatch.*"]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=config",
    "--cov=handlers",
    "--cov=helpers",
    "--cov=utils",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
asyncio_mode = "strict"
filterwarnings = [
    "error::UserWarning",
    "ignore::DeprecationWarning:telegram",
    "ignore::PendingDeprecationWarning",
]

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
omit = [
    "tests/*",
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
