services:
  cronwatchbot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cronwatchbot:latest
    container_name: cronwatchbot
    restart: unless-stopped
    
    env_file:
      - ../.env
    
    volumes:
      - urlwatch-data:/home/cronwatchbot/.config/urlwatch  # URLWatch config & cache
      - crontab-data:/var/spool/cron  # Crontab directory for python-crontab
    
    # Security hardening
    read_only: true  # Root filesystem read-only
    tmpfs:
      - /tmp:noexec,nosuid,size=100m  # Secure temp directory
    cap_drop:
      - ALL  # Drop all capabilities
    cap_add:
      - SETUID  # su-exec user switching
      - SETGID  # su-exec group switching  
      - CHOWN   # File ownership operations
      - FOWNER  # File ownership bypass
      - DAC_OVERRIDE  # crontab permission bypass
    
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'python.*main.py' && pgrep crond"]
      interval: 60s
      timeout: 10s
      start_period: 15s
      retries: 3
    
    # Resource limits (optional - adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  urlwatch-data:
    driver: local
  crontab-data:
    driver: local
